::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2A2A2A;border-radius:3px}

// ── MODAL WRAPPER ──

// ── CONFIRM DIALOG ──

// ── LOGIN ──
function Login({onLogin}){
  const [email,setEmail]=useState('');
  const [pass,setPass]=useState('');
  const [showP,setShowP]=useState(false);
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);
  const [hints,setHints]=useState(false);

  const doLogin=async()=>{
    if(!email||!pass){setErr('Preencha e-mail e senha.');return;}
    setLoading(true);setErr('');
    const {data,error}=await db.from('corretores').select('*').eq('email',email.trim().toLowerCase()).eq('senha',pass).single();
    setLoading(false);
    if(error||!data){setErr('E-mail ou senha incorretos.');return;}
    onLogin(data);
  };

  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
      <div style={{width:360,maxWidth:'100%'}}>
        <div style={{textAlign:'center',marginBottom:36}}>
          <div style={{fontSize:28,fontWeight:800,color:G,letterSpacing:2,marginBottom:6}}>ALTHOFF</div>
          <div style={{fontSize:10,color:'#444',letterSpacing:3,textTransform:'uppercase'}}>CRM Comercial</div>
        </div>
        <Card style={{padding:28}}>
          <h2 style={{margin:'0 0 22px',fontSize:17,fontWeight:700}}>Entrar na sua conta</h2>
          <label style={lbl_style}>E-mail</label>
          <input style={inp_style} type="email" value={email} onChange={e=>{setEmail(e.target.value);setErr('');}} placeholder="seu@althoff.com.br" onKeyDown={e=>e.key==='Enter'&&doLogin()}/>
          <label style={lbl_style}>Senha</label>
          <div style={{position:'relative',marginBottom:10}}>
            <input style={{...inp_style,marginBottom:0,paddingRight:42}} type={showP?'text':'password'} value={pass} onChange={e=>{setPass(e.target.value);setErr('');}} placeholder="••••••" onKeyDown={e=>e.key==='Enter'&&doLogin()}/>
            <div onClick={()=>setShowP(!showP)} style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',cursor:'pointer',color:'#555'}}><Ico d={showP?IC.noeye:IC.eye} size={16}/></div>
          </div>
          {err&&<div style={{background:'#EF444418',border:'1px solid #EF444430',borderRadius:7,padding:'8px 12px',fontSize:12,color:'#EF4444',marginBottom:14}}>{err}</div>}
          <button onClick={doLogin} disabled={loading} style={{width:'100%',padding:12,borderRadius:8,background:G,border:'none',color:'#000',fontWeight:700,fontSize:15,cursor:'pointer',marginBottom:16,opacity:loading?0.7:1}}>
            {loading?'Entrando...':'Entrar'}
          </button>
          <div onClick={()=>setHints(!hints)} style={{textAlign:'center',fontSize:12,color:'#444',cursor:'pointer'}}>{hints?'▲ Ocultar':'▼ Ver acessos de teste'}</div>
          {hints&&(
            <div style={{marginTop:12,padding:12,background:'#0E0E0E',borderRadius:8,border:'1px solid #1C1C1C'}}>
              {[['ana@althoff.com.br','123456'],['carlos@althoff.com.br','123456'],['admin@althoff.com.br','admin123']].map(([e,p])=>(
                <div key={e} onClick={()=>{setEmail(e);setPass(p);setErr('');}}
                  style={{padding:'6px 8px',borderRadius:6,cursor:'pointer',marginBottom:3,background:email===e?GA:'transparent'}}>
                  <div style={{fontSize:11,color:'#CCC'}}>{e}</div>
                  <div style={{fontSize:10,color:'#444'}}>senha: {p}</div>
                </div>
              ))}
            </div>
          )}
        </Card>
      </div>
    </div>
  );
}

// ── FORMS ──
function FormLead({initial={},onSave,onClose,corretor,imoveis,corretores,isAdmin}){
  const [f,setF]=useState({nome:'',telefone:'',email:'',interesse:'',status:'Novo',valor:'',imovel_id:'',origem:'',corretor_id:corretor?.id||'',...initial,valor:initial.valor||''});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const handleProp=v=>{set('imovel_id',v);if(v){const p=imoveis.find(x=>String(x.id)===v);if(p)set('interesse',p.titulo);}};
  const isEdit=!!initial.id;
  return (
    <div>
      <label style={lbl_style}>Nome *</label>
      <input style={inp_style} value={f.nome} onChange={e=>set('nome',e.target.value)} placeholder="Nome ou empresa"/>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <div><label style={lbl_style}>Telefone</label><input style={inp_style} value={f.telefone} onChange={e=>set('telefone',e.target.value)} placeholder="(47) 99999-9999"/></div>
        <div><label style={lbl_style}>E-mail</label><input style={inp_style} value={f.email} onChange={e=>set('email',e.target.value)} placeholder="email@ex.com"/></div>
      </div>
      <label style={lbl_style}>Imóvel de interesse</label>
      <select style={inp_style} value={f.imovel_id} onChange={e=>handleProp(e.target.value)}>
        <option value="">Selecionar imóvel (opcional)</option>
        {imoveis.map(p=><option key={p.id} value={String(p.id)}>{p.titulo}</option>)}
      </select>
      <label style={lbl_style}>Interesse / Descrição</label>
      <input style={inp_style} value={f.interesse} onChange={e=>set('interesse',e.target.value)} placeholder="Ex: Sala comercial..."/>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <div><label style={lbl_style}>Status</label>
          <select style={inp_style} value={f.status} onChange={e=>set('status',e.target.value)}>{ST.map(s=><option key={s}>{s}</option>)}</select>
        </div>
        <div><label style={lbl_style}>Valor (R$)</label>
          <input style={inp_style} type="number" value={f.valor} onChange={e=>set('valor',e.target.value)} placeholder="0"/>
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <div><label style={lbl_style}>Origem</label>
          <select style={inp_style} value={f.origem} onChange={e=>set('origem',e.target.value)}>
            <option value="">Selecionar</option>
            {['Site','Instagram','WhatsApp','Indicação','LinkedIn','Google','Outro'].map(o=><option key={o}>{o}</option>)}
          </select>
        </div>
        {isAdmin&&<div><label style={lbl_style}>Corretor</label>
          <select style={inp_style} value={f.corretor_id} onChange={e=>set('corretor_id',e.target.value)}>
            {corretores.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}
          </select>
        </div>}
      </div>
      <div style={{display:'flex',gap:10,marginTop:8}}>
        <Btn outline onClick={onClose}>Cancelar</Btn>
        <button onClick={()=>f.nome&&onSave({...f,valor:Number(f.valor)||0,imovel_id:f.imovel_id?Number(f.imovel_id):null,corretor_id:f.corretor_id||corretor?.id})}
          style={{flex:1,padding:11,borderRadius:8,background:G,border:'none',color:'#000',fontWeight:700,fontSize:14,cursor:'pointer'}}>
          {isEdit?'Salvar Alterações':'Adicionar Lead'}
        </button>
      </div>
    </div>
  );
}

          style={{flex:1,padding:11,borderRadius:8,background:G,border:'none',color:'#000',fontWeight:700,fontSize:14,cursor:'pointer'}}>
          {isEdit?'Salvar Alterações':'Registrar Imóvel'}
        </button>
      </div>
    </div>
  );
}

// ── HISTÓRICO DE INTERAÇÕES ──
function Historico({lead,corretor,onClose}){
  const [hist,setHist]=useState([]);
  const [loading,setLoading]=useState(true);
  const [tipo,setTipo]=useState('Anotação');
  const [texto,setTexto]=useState('');
  const [saving,setSaving]=useState(false);

  useEffect(()=>{loadHist();},[]);

  const loadHist=async()=>{
    setLoading(true);
    const {data}=await db.from('historico').select('*').eq('lead_id',lead.id).order('criado_em',{ascending:false});
    setHist(data||[]);
    setLoading(false);
  };

  const addHist=async()=>{
    if(!texto.trim())return;
    setSaving(true);
    const {data}=await db.from('historico').insert({lead_id:lead.id,corretor_id:corretor.id,tipo,texto,corretor_nome:corretor.nome}).select().single();
    if(data)setHist(p=>[data,...p]);
    setTexto('');
    setSaving(false);
  };

  const delHist=async(id)=>{
    await db.from('historico').delete().eq('id',id);
    setHist(p=>p.filter(h=>h.id!==id));
  };

  return (
    <div>
      <div style={{background:'#0E0E0E',borderRadius:10,padding:14,marginBottom:16,border:'1px solid #1C1C1C'}}>
        <div style={{fontSize:13,fontWeight:700,marginBottom:2}}>{lead.nome}</div>
        <div style={{fontSize:11,color:'#555'}}>{lead.interesse} · <span style={{color:SC[lead.status]||'#888'}}>{lead.status}</span></div>
      </div>
      <div style={{marginBottom:16}}>
        <label style={lbl_style}>Tipo de interação</label>
        <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:10}}>
          {INT_TIPOS.map(t=>(
            <button key={t} onClick={()=>setTipo(t)}
              style={{padding:'5px 10px',borderRadius:6,border:`1px solid ${tipo===t?G:'#2A2A2A'}`,background:tipo===t?GA:'transparent',color:tipo===t?G:'#666',fontSize:12,cursor:'pointer'}}>
              {INT_IC[t]} {t}
            </button>
          ))}
        </div>
        <label style={lbl_style}>Descrição *</label>
        <textarea value={texto} onChange={e=>setTexto(e.target.value)} placeholder={`Registre detalhes da ${tipo.toLowerCase()}...`}
          style={{...inp_style,minHeight:80,resize:'vertical',marginBottom:8}}
          onKeyDown={e=>e.ctrlKey&&e.key==='Enter'&&addHist()}/>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span style={{fontSize:11,color:'#444'}}>Ctrl+Enter para salvar</span>
          <Btn onClick={addHist} disabled={saving||!texto.trim()}>{saving?'Salvando...':'Registrar'}</Btn>
        </div>
      </div>
      <div style={{borderTop:'1px solid #1C1C1C',paddingTop:14}}>
        <div style={{fontSize:11,color:'#555',fontWeight:600,textTransform:'uppercase',letterSpacing:1,marginBottom:10}}>Histórico ({hist.length})</div>
        {loading?<Spin/>:hist.length===0?(
          <div style={{textAlign:'center',padding:'24px 0',color:'#333',fontSize:13}}>Nenhuma interação registrada ainda.</div>
        ):hist.map(h=>(
          <div key={h.id} style={{padding:'10px 12px',background:'#0E0E0E',borderRadius:9,border:'1px solid #1A1A1A',marginBottom:8}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:5}}>
              <div style={{display:'flex',alignItems:'center',gap:7}}>
                <span style={{fontSize:14}}>{INT_IC[h.tipo]||'📝'}</span>
                <span style={{fontSize:12,fontWeight:600,color:G}}>{h.tipo}</span>
                <span style={{fontSize:11,color:'#444'}}>· {h.corretor_nome}</span>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <span style={{fontSize:10,color:'#444'}}>{new Date(h.criado_em).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span>
                {(corretor.id===h.corretor_id||corretor.is_admin)&&(
                  <div onClick={()=>delHist(h.id)} style={{cursor:'pointer',color:'#444',padding:2}}><Ico d={IC.trash} size={13}/></div>
                )}
              </div>
            </div>
            <div style={{fontSize:13,color:'#CCC',lineHeight:1.6,whiteSpace:'pre-wrap'}}>{h.texto}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── DASHBOARD ──

  const myV=isAdmin?visitas:visitas.filter(v=>v.corretor_id===corretor?.id);
  const stats=[
    {l:isAdmin?'Total Leads':'Meus Leads',v:mine.length,sub:`${active.length} ativos`,col:'#3B82F6',ic:IC.users},

              <div style={{width:28,height:28,borderRadius:7,background:`${col}18`,display:'flex',alignItems:'center',justifyContent:'center'}}><Ico d={ic} size={13} col={col}/></div>
            </div>
            <div style={{fontSize:20,fontWeight:700,color:col,marginBottom:2}}>{v}</div>
            <div style={{fontSize:11,color:'#444'}}>{sub}</div>
          </Card>
        ))}
      </div>
      <div className="two-col" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
        <Card style={{padding:16}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
            <span style={{fontWeight:600,fontSize:13}}>{isAdmin?'Leads Recentes':'Meus Leads'}</span>
            <span onClick={()=>setSec('pipeline')} style={{fontSize:11,color:G,cursor:'pointer'}}>Ver todos →</span>
          </div>
          {mine.slice(0,6).map(l=>(
            <div key={l.id} style={{display:'flex',alignItems:'center',gap:9,padding:'7px 0',borderBottom:'1px solid #181818'}}>
              <div style={{width:30,height:30,borderRadius:8,background:GA,display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:700,color:G,flexShrink:0}}>{(l.nome||'?')[0]}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{l.nome}</div>

        </Card>
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          <Card style={{padding:16}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>

              <div key={v.id} style={{display:'flex',alignItems:'center',gap:9,padding:'7px 0',borderBottom:'1px solid #181818'}}>

            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>

                <span style={{fontSize:10,color:'#EF4444',background:'#EF444418',borderRadius:4,padding:'2px 6px',flexShrink:0}}>{t.prazo?.slice(8)}/{t.prazo?.slice(5,7)}</span>
              </div>
            ))}

        </div>
      </div>
    </div>
  );
}

// ── PIPELINE ──
function Pipeline({leads,imoveis,corretor,isAdmin,setLeads,setModal,corretores}){
  const [showAll,setShowAll]=useState(isAdmin);
  const [sel,setSel]=useState(null);
  const [histLead,setHistLead]=useState(null);
  const [editLead,setEditLead]=useState(null);
  const [confirm,setConfirm]=useState(null);
  const [busca,setBusca]=useState('');
  const [filtroStatus,setFiltroStatus]=useState('');

  const filtered=(showAll?leads:leads.filter(l=>l.corretor_id===corretor?.id))
    .filter(l=>!busca||l.nome.toLowerCase().includes(busca.toLowerCase())||l.interesse?.toLowerCase().includes(busca.toLowerCase()))
    .filter(l=>!filtroStatus||l.status===filtroStatus);

  const moveLead=async(id,status)=>{
    await db.from('leads').update({status}).eq('id',id);
    setLeads(p=>p.map(l=>l.id===id?{...l,status}:l));
    setSel(null);
  };

  const deleteLead=async(id)=>{
    await db.from('leads').delete().eq('id',id);
    setLeads(p=>p.filter(l=>l.id!==id));
    setConfirm(null);setSel(null);
  };

  const saveLead=async(f)=>{
    const {data}=await db.from('leads').update(f).eq('id',f.id).select().single();
    if(data)setLeads(p=>p.map(l=>l.id===data.id?data:l));
    setEditLead(null);
  };

  const cols=ST.slice(0,-1);

  return (
    <div className="fade">
      {confirm&&<Confirm msg={`Excluir lead "${confirm.nome}"? Esta ação não pode ser desfeita.`} onYes={()=>deleteLead(confirm.id)} onNo={()=>setConfirm(null)}/>}
      {histLead&&<Modal title={`Histórico — ${histLead.nome}`} onClose={()=>setHistLead(null)} width={520}><Historico lead={histLead} corretor={corretor} onClose={()=>setHistLead(null)}/></Modal>}
      {editLead&&<Modal title="Editar Lead" onClose={()=>setEditLead(null)} width={460}><FormLead initial={editLead} onSave={saveLead} onClose={()=>setEditLead(null)} corretor={corretor} imoveis={imoveis} corretores={corretores} isAdmin={isAdmin}/></Modal>}

      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16,flexWrap:'wrap'}}>
        <div style={{position:'relative',flex:1,minWidth:200}}>
          <div style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'#555'}}><Ico d={IC.search} size={14}/></div>
          <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Buscar lead..." style={{...inp_style,marginBottom:0,paddingLeft:34,paddingRight:12}}/>
        </div>
        <select value={filtroStatus} onChange={e=>setFiltroStatus(e.target.value)} style={{...inp_style,marginBottom:0,width:'auto'}}>
          <option value="">Todos os status</option>
          {ST.map(s=><option key={s}>{s}</option>)}
        </select>
        {isAdmin&&(
          <div style={{display:'flex',gap:6}}>
            {[[true,'Todos'],[false,'Meus']].map(([a,l])=>(
              <button key={String(a)} onClick={()=>setShowAll(a)}
                style={{padding:'6px 12px',borderRadius:6,border:`1px solid ${showAll===a?G:'#2A2A2A'}`,background:showAll===a?GA:'transparent',color:showAll===a?G:'#555',fontSize:12,cursor:'pointer'}}>{l}</button>
            ))}
          </div>
        )}
        <Btn onClick={()=>setModal('addLead')}><Ico d={IC.plus} size={14}/> Novo Lead</Btn>
      </div>

      <div style={{display:'flex',gap:10,overflowX:'auto',paddingBottom:12}}>
        {cols.map(status=>{
          const col=SC[status];
          const sLeads=filtered.filter(l=>l.status===status);
          return (
            <div key={status} className="pipeline-col" style={{minWidth:180,flexShrink:0}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
                <div style={{display:'flex',alignItems:'center',gap:5}}>
                  <div style={{width:7,height:7,borderRadius:'50%',background:col}}/>
                  <span style={{fontSize:11,fontWeight:600,color:'#AAA'}}>{status}</span>
                </div>
                <span style={{fontSize:10,background:'#1C1C1C',color:'#555',borderRadius:10,padding:'1px 6px'}}>{sLeads.length}</span>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:7}}>
                {sLeads.map(l=>{
                  const open=sel===l.id;
                  return (
                    <div key={l.id} onClick={()=>setSel(open?null:l.id)}
                      style={{background:'#141414',border:`1px solid ${open?col:'#212121'}`,borderRadius:10,padding:11,cursor:'pointer',transition:'border-color .15s'}}>
                      <div style={{fontSize:12,fontWeight:600,marginBottom:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{l.nome}</div>
                      <div style={{fontSize:11,color:'#555',marginBottom:7,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{l.interesse||'—'}</div>
                      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                        <span style={{fontSize:12,color:G,fontWeight:600}}>{fmt(l.valor)}</span>
                        {l.origem&&<span style={{fontSize:10,color:'#444',background:'#1C1C1C',borderRadius:4,padding:'1px 5px'}}>{l.origem}</span>}
                      </div>
                      {open&&(
                        <div style={{marginTop:9,paddingTop:9,borderTop:'1px solid #1E1E1E'}}>
                          <div style={{display:'flex',gap:6,marginBottom:8}}>
                            <button onClick={e=>{e.stopPropagation();setHistLead(l);setSel(null);}}
                              style={{display:'flex',alignItems:'center',gap:4,padding:'4px 8px',borderRadius:6,background:GA,border:`1px solid ${G}33`,color:G,fontSize:11,cursor:'pointer'}}>
                              <Ico d={IC.hist} size={11}/> Histórico
                            </button>
                            <button onClick={e=>{e.stopPropagation();setEditLead(l);setSel(null);}}
                              style={{display:'flex',alignItems:'center',gap:4,padding:'4px 8px',borderRadius:6,background:'#1C1C1C',border:'1px solid #2A2A2A',color:'#888',fontSize:11,cursor:'pointer'}}>
                              <Ico d={IC.edit} size={11}/> Editar
                            </button>
                            <button onClick={e=>{e.stopPropagation();setConfirm(l);}}
                              style={{padding:'4px 8px',borderRadius:6,background:'#EF444418',border:'1px solid #EF444430',color:'#EF4444',fontSize:11,cursor:'pointer'}}>
                              <Ico d={IC.trash} size={11}/>
                            </button>
                          </div>
                          <div style={{fontSize:10,color:'#555',marginBottom:5}}>Mover para:</div>
                          <div style={{display:'flex',flexWrap:'wrap',gap:3}}>
                            {ST.filter(s=>s!==status).map(s=>(
                              <span key={s} onClick={e=>{e.stopPropagation();moveLead(l.id,s);}}
                                style={{fontSize:10,background:`${SC[s]}15`,color:SC[s],border:`1px solid ${SC[s]}30`,borderRadius:4,padding:'2px 5px',cursor:'pointer'}}>{s}</span>
                            ))}
                          </div>
                          {l.telefone&&<a href={`tel:${l.telefone}`} onClick={e=>e.stopPropagation()} style={{display:'flex',alignItems:'center',gap:4,fontSize:11,color:'#22C55E',textDecoration:'none',marginTop:7}}><Ico d={IC.ph} size={10}/>{l.telefone}</a>}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── TAREFAS ──
function Tarefas({tarefas,setTarefas,corretor,isAdmin,toggleTask,corretores}){
  const mine=isAdmin?tarefas:tarefas.filter(t=>t.corretor_id===corretor?.id);
  const pending=mine.filter(t=>!t.concluida);
  const done=mine.filter(t=>t.concluida);
  const [showAdd,setShowAdd]=useState(false);
  const [f,setF]=useState({titulo:'',tipo:'Ligação',prioridade:'Média',prazo:'',corretor_id:corretor?.id||''});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));

  const addTask=async()=>{
    if(!f.titulo)return;
    const {data}=await db.from('tarefas').insert({...f,corretor_id:f.corretor_id||corretor?.id}).select().single();
    if(data)setTarefas(p=>[...p,data]);
    setF({titulo:'',tipo:'Ligação',prioridade:'Média',prazo:'',corretor_id:corretor?.id||''});
    setShowAdd(false);
  };

  return (
    <div className="fade">
      <div style={{display:'flex',justifyContent:'flex-end',marginBottom:16}}>
        <Btn onClick={()=>setShowAdd(!showAdd)}><Ico d={IC.plus} size={14}/> Nova Tarefa</Btn>
      </div>

      {showAdd&&(
        <Card style={{padding:16,marginBottom:16}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
            <div style={{gridColumn:'1/-1'}}><label style={lbl_style}>Título *</label><input style={inp_style} value={f.titulo} onChange={e=>set('titulo',e.target.value)} placeholder="Descrição da tarefa"/></div>
            <div><label style={lbl_style}>Tipo</label><select style={inp_style} value={f.tipo} onChange={e=>set('tipo',e.target.value)}>{['Ligação','Reunião','Proposta','Visita','E-mail','Docs','Marketing','Outro'].map(t=><option key={t}>{t}</option>)}</select></div>
            <div><label style={lbl_style}>Prioridade</label><select style={inp_style} value={f.prioridade} onChange={e=>set('prioridade',e.target.value)}>{['Alta','Média','Baixa'].map(p=><option key={p}>{p}</option>)}</select></div>
            <div><label style={lbl_style}>Prazo</label><input style={inp_style} type="date" value={f.prazo} onChange={e=>set('prazo',e.target.value)}/></div>
            {isAdmin&&<div><label style={lbl_style}>Corretor</label><select style={inp_style} value={f.corretor_id} onChange={e=>set('corretor_id',e.target.value)}>{corretores.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}</select></div>}
          </div>
          <div style={{display:'flex',gap:10}}>
            <Btn outline onClick={()=>setShowAdd(false)}>Cancelar</Btn>
            <Btn onClick={addTask}>Salvar Tarefa</Btn>
          </div>
        </Card>
      )}

      <div style={{marginBottom:20}}>
        <div style={{fontSize:11,color:'#555',fontWeight:600,textTransform:'uppercase',letterSpacing:1.2,marginBottom:10}}>Pendentes ({pending.length})</div>
        {pending.map(t=>{
          const b=corretores.find(c=>c.id===t.corretor_id);
          const late=t.prazo&&t.prazo<new Date().toISOString().slice(0,10);
          return (
            <Card key={t.id} style={{padding:'11px 14px',marginBottom:7}}>
              <div style={{display:'flex',alignItems:'center',gap:11}}>
                <div onClick={()=>toggleTask(t.id)}
                  style={{width:19,height:19,borderRadius:'50%',border:'2px solid #2E2E2E',cursor:'pointer',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.titulo}</div>
                  <div style={{display:'flex',gap:8,marginTop:2}}>
                    <span style={{fontSize:11,color:'#555'}}>{t.tipo}</span>
                    {t.prazo&&<span style={{fontSize:11,color:late?'#EF4444':'#444'}}>{late?'⚠ ':''}{fmtDate(t.prazo)}</span>}
                  </div>
                </div>
                <Badge label={t.prioridade} color={PRI_C[t.prioridade]||'#888'}/>
                {isAdmin&&b&&<Avatar b={b} size={22}/>}
              </div>
            </Card>
          );
        })}
        {pending.length===0&&<div style={{fontSize:13,color:'#333',padding:'20px 0',textAlign:'center'}}>Todas as tarefas concluídas! 🎉</div>}
      </div>

      {done.length>0&&(
        <div>
          <div style={{fontSize:11,color:'#333',fontWeight:600,textTransform:'uppercase',letterSpacing:1.2,marginBottom:10}}>Concluídas ({done.length})</div>
          {done.map(t=>(
            <div key={t.id} style={{display:'flex',alignItems:'center',gap:11,padding:'9px 14px',background:'#0E0E0E',borderRadius:8,border:'1px solid #181818',opacity:0.5,marginBottom:5}}>
              <div onClick={()=>toggleTask(t.id)} style={{width:19,height:19,borderRadius:'50%',background:'#22C55E18',border:'2px solid #22C55E',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Ico d={IC.chk} size={10} col="#22C55E"/></div>
              <span style={{fontSize:12,textDecoration:'line-through',color:'#444',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.titulo}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── RELATÓRIOS ──
function Relatorios({leads,tarefas,visitas,corretores,isAdmin,corretor}){
  const [periodo,setPeriodo]=useState('30');

  const since=new Date();
  since.setDate(since.getDate()-Number(periodo));
  const sinceStr=since.toISOString().slice(0,10);

  const leadsRecentes=leads.filter(l=>l.criado_em>=sinceStr);
  const stats=corretores.filter(c=>!c.is_admin).map(c=>{
    const mLeads=leads.filter(l=>l.corretor_id===c.id);
    const mRecentes=leadsRecentes.filter(l=>l.corretor_id===c.id);
    const mFechados=mLeads.filter(l=>l.status==='Fechado');
    const mAtivos=mLeads.filter(l=>!['Fechado','Perdido'].includes(l.status));
    const mPipeline=mAtivos.reduce((s,l)=>s+(l.valor||0),0);
    const mTarefas=tarefas.filter(t=>t.corretor_id===c.id&&!t.concluida);
    return {corretor:c,total:mLeads.length,recentes:mRecentes.length,fechados:mFechados.length,ativos:mAtivos.length,pipeline:mPipeline,tarefas:mTarefas.length};
  }).sort((a,b)=>b.fechados-a.fechados);

  const totalPipeline=stats.reduce((s,x)=>s+x.pipeline,0);
  const totalFechados=stats.reduce((s,x)=>s+x.fechados,0);

  const byStatus=ST.map(s=>({status:s,count:leads.filter(l=>l.status===s).length,col:SC[s]}));

  return (
    <div className="fade">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:10}}>
        <span style={{fontSize:13,color:'#666'}}>Visão geral do time</span>
        <div style={{display:'flex',gap:6}}>
          {[['7','7 dias'],['30','30 dias'],['90','90 dias']].map(([v,l])=>(
            <button key={v} onClick={()=>setPeriodo(v)}
              style={{padding:'6px 12px',borderRadius:6,border:`1px solid ${periodo===v?G:'#2A2A2A'}`,background:periodo===v?GA:'transparent',color:periodo===v?G:'#555',fontSize:12,cursor:'pointer'}}>{l}</button>
          ))}
        </div>
      </div>

      <div className="stats-grid" style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:18}}>
        {[
          {l:'Total Leads',v:leads.length,col:'#3B82F6'},
          {l:'Pipeline Total',v:fmt(totalPipeline),col:G},
          {l:'Fechamentos',v:totalFechados,col:'#22C55E'},
          {l:'Leads no período',v:leadsRecentes.length,col:'#8B5CF6'},
        ].map(({l,v,col})=>(
          <Card key={l} style={{padding:14}}>
            <div style={{fontSize:10,color:'#555',textTransform:'uppercase',letterSpacing:1.2,marginBottom:6}}>{l}</div>
            <div style={{fontSize:22,fontWeight:700,color:col}}>{v}</div>
          </Card>
        ))}
      </div>

      <div className="two-col" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:14}}>
        <Card style={{padding:16}}>
          <div style={{fontWeight:600,fontSize:13,marginBottom:14}}>Desempenho por Corretor</div>
          {stats.map(({corretor:c,total,fechados,ativos,pipeline,tarefas:t})=>(
            <div key={c.id} style={{padding:'10px 0',borderBottom:'1px solid #1A1A1A'}}>
              <div style={{display:'flex',alignItems:'center',gap:9,marginBottom:8}}>
                <Avatar b={c} size={28}/>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:600}}>{c.nome}</div>
                  <div style={{fontSize:11,color:'#555'}}>{total} leads · {t} tarefas pendentes</div>
                </div>
                <div style={{textAlign:'right'}}>
                  <div style={{fontSize:13,fontWeight:700,color:G}}>{fmt(pipeline)}</div>
                  <div style={{fontSize:10,color:'#444'}}>pipeline</div>
                </div>
              </div>
              <div style={{display:'flex',gap:8}}>
                <div style={{flex:1,background:'#0E0E0E',borderRadius:6,padding:'5px 9px',textAlign:'center'}}>
                  <div style={{fontSize:16,fontWeight:700,color:'#3B82F6'}}>{ativos}</div>
                  <div style={{fontSize:9,color:'#444'}}>Ativos</div>
                </div>
                <div style={{flex:1,background:'#0E0E0E',borderRadius:6,padding:'5px 9px',textAlign:'center'}}>
                  <div style={{fontSize:16,fontWeight:700,color:'#22C55E'}}>{fechados}</div>
                  <div style={{fontSize:9,color:'#444'}}>Fechados</div>
                </div>
              </div>
            </div>
          ))}
        </Card>

        <Card style={{padding:16}}>
          <div style={{fontWeight:600,fontSize:13,marginBottom:14}}>Leads por Status</div>
          {byStatus.filter(x=>x.count>0).map(({status,count,col})=>{
            const pct=leads.length?Math.round(count/leads.length*100):0;
            return (
              <div key={status} style={{marginBottom:10}}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                  <span style={{fontSize:12,color:'#AAA'}}>{status}</span>
                  <span style={{fontSize:12,color:col,fontWeight:600}}>{count}</span>
                </div>
                <div style={{height:6,background:'#1C1C1C',borderRadius:3,overflow:'hidden'}}>
                  <div style={{height:'100%',width:`${pct}%`,background:col,borderRadius:3,transition:'width .5s'}}/>
                </div>
              </div>
            );
          })}
          {leads.length===0&&<div style={{fontSize:12,color:'#333',textAlign:'center',padding:'20px 0'}}>Nenhum lead cadastrado.</div>}
        </Card>
      </div>
    </div>
  );
}

              <div>
                <div style={{borderBottom:'1px solid #1C1C1C',paddingBottom:8,marginBottom:10}}><span style={{fontSize:11,color:'#555'}}>Assunto: </span><span style={{fontSize:13,fontWeight:600}}>{tpl.sf(ln)}</span></div>

// ── APP PRINCIPAL ──
function App(){
  const [user,setUser]=useState(null);
  const [sec,setSec]=useState('dashboard');
  const [leads,setLeads]=useState([]);
  const [imoveis,setImoveis]=useState([]);
  const [tarefas,setTarefas]=useState([]);
  const [visitas,setVisitas]=useState([]);
  const [corretores,setCorretores]=useState([]);
  const [loading,setLoading]=useState(false);
  const [modal,setModal]=useState(null);
  const [sideOpen,setSideOpen]=useState(false);

  const isAdmin=user?.is_admin||false;

  useEffect(()=>{if(user){loadAll();}},[ user]);

  const loadAll=async()=>{
    setLoading(true);
    const [l,im,t,v,c]=await Promise.all([
      db.from('leads').select('*').order('criado_em',{ascending:false}),
      db.from('imoveis').select('*').order('criado_em',{ascending:false}),
      db.from('tarefas').select('*').order('prazo',{ascending:true}),
      db.from('visitas').select('*').order('data',{ascending:true}),
      db.from('corretores').select('*').order('nome'),
    ]);
    setLeads(l.data||[]);
    setImoveis(im.data||[]);
    setTarefas(t.data||[]);
    setVisitas(v.data||[]);
    setCorretores(c.data||[]);
    setLoading(false);
  };

  const addLead=async(f)=>{
    const bId=f.imovel_id?(imoveis.find(p=>p.id===f.imovel_id)?.captador_id||user?.id):f.corretor_id||user?.id;
    const {data}=await db.from('leads').insert({...f,corretor_id:bId}).select().single();
    if(data)setLeads(p=>[data,...p]);
    setModal(null);
  };

  const addImovel=async(f)=>{
    const {data}=await db.from('imoveis').insert({...f,captador_id:user?.id}).select().single();
    if(data)setImoveis(p=>[data,...p]);
    setModal(null);
  };

  const toggleTask=async(id)=>{
    const t=tarefas.find(x=>x.id===id);
    if(!t)return;
    await db.from('tarefas').update({concluida:!t.concluida}).eq('id',id);
    setTarefas(p=>p.map(x=>x.id===id?{...x,concluida:!x.concluida}:x));
  };

  if(!user)return <Login onLogin={setUser}/>;

  const NAV=[
    {id:'dashboard',ic:IC.dash,l:'Dashboard'},
    {id:'pipeline',ic:IC.users,l:'Pipeline'},
    {id:'imoveis',ic:IC.bld,l:'Imóveis'},
    {id:'agenda',ic:IC.cal,l:'Agenda'},
    {id:'tasks',ic:IC.task,l:'Tarefas'},
    {id:'relatorios',ic:IC.chart,l:'Relatórios'},
    {id:'dispatch',ic:IC.send,l:'Disparos'},
  ];
  const TITLES={dashboard:'Dashboard',pipeline:'Pipeline de Leads',imoveis:'Imóveis',agenda:'Agenda de Visitas',tasks:'Tarefas',relatorios:'Relatórios',dispatch:'Disparos'};

  return (
    <div style={{display:'flex',height:'100vh',overflow:'hidden',position:'relative'}}>
      {/* Mobile overlay */}
      <div className="overlay" style={{display:'none',position:'fixed',inset:0,background:'rgba(0,0,0,0.6)',zIndex:299}} onClick={()=>setSideOpen(false)}/>

      {/* SIDEBAR */}
      <div className={`sidebar${sideOpen?' open':''}`} style={{width:215,background:'#0D0D0D',borderRight:'1px solid #1C1C1C',display:'flex',flexDirection:'column',flexShrink:0}}>
        <div style={{padding:'16px 18px 12px',borderBottom:'1px solid #181818',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div>
            <div style={{fontSize:16,fontWeight:800,color:G,letterSpacing:1}}>ALTHOFF</div>
            <div style={{fontSize:10,color:'#444',letterSpacing:2.5,textTransform:'uppercase',marginTop:1}}>CRM Comercial</div>
          </div>
          <div className="sidebar-close" style={{cursor:'pointer',color:'#444',display:'none'}} onClick={()=>setSideOpen(false)}><Ico d={IC.close} size={18}/></div>
        </div>
        <nav style={{flex:1,padding:'10px 8px',overflowY:'auto'}}>
          {NAV.map(({id,ic,l})=>(
            <div key={id} onClick={()=>{setSec(id);setSideOpen(false);}}
              style={{display:'flex',alignItems:'center',gap:9,padding:'9px 11px',borderRadius:8,cursor:'pointer',marginBottom:2,background:sec===id?GA:'transparent',color:sec===id?G:'#555',transition:'all .15s'}}>
              <Ico d={ic} size={15} col={sec===id?G:'#555'}/>
              <span style={{fontSize:13,fontWeight:sec===id?600:400}}>{l}</span>
            </div>
          ))}
        </nav>
        <div style={{padding:'10px 10px',borderTop:'1px solid #181818'}}>
          <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',background:'#161616',borderRadius:8,border:'1px solid #222',marginBottom:8}}>
            {isAdmin?<div style={{width:26,height:26,borderRadius:'50%',background:'#222',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Ico d={IC.shld} size={13} col={G}/></div>:<Avatar b={user} size={26}/>}
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:12,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{isAdmin?'Administrador':user?.nome}</div>
              <div style={{fontSize:10,color:'#444'}}>{isAdmin?'Acesso total':'Corretor(a)'}</div>
            </div>
          </div>
          <button onClick={()=>setUser(null)}
            style={{width:'100%',display:'flex',alignItems:'center',justifyContent:'center',gap:7,padding:7,borderRadius:7,background:'transparent',border:'1px solid #1E1E1E',color:'#555',fontSize:12,cursor:'pointer'}}>
            <Ico d={IC.out} size={13}/> Sair
          </button>
        </div>
      </div>

      {/* MAIN */}
      <div className="main-content" style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div style={{padding:'12px 18px',borderBottom:'1px solid #181818',display:'flex',alignItems:'center',justifyContent:'space-between',background:'#0A0A0A',flexShrink:0}}>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <div style={{cursor:'pointer',color:'#555',display:'none'}} className="menu-btn" onClick={()=>setSideOpen(true)}><Ico d={IC.menu} size={20}/></div>
            <div>
              <h1 style={{margin:0,fontSize:16,fontWeight:700}}>{TITLES[sec]}</h1>
              <div style={{fontSize:11,color:'#444',marginTop:1}}>Althoff Grupo</div>
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <div style={{display:'flex',alignItems:'center',gap:8,background:'#161616',border:`1px solid ${G}33`,borderRadius:8,padding:'5px 10px'}}>
              {isAdmin?<Ico d={IC.shld} size={13} col={G}/>:<Avatar b={user} size={20}/>}
              <span style={{fontSize:12,fontWeight:600}}>{isAdmin?'Admin':user?.nome?.split(' ')[0]}</span>
            </div>
          </div>
        </div>

        <div style={{flex:1,overflow:'auto',padding:'18px 20px'}}>
          {loading?<Spin/>:<>
            {sec==='dashboard'&&<Dashboard leads={leads} tarefas={tarefas} visitas={visitas} setSec={setSec} corretor={user} isAdmin={isAdmin} toggleTask={toggleTask} corretores={corretores}/>}
            {sec==='pipeline'&&<Pipeline leads={leads} imoveis={imoveis} corretor={user} isAdmin={isAdmin} setLeads={setLeads} setModal={setModal} corretores={corretores}/>}
            {sec==='imoveis'&&<Imoveis imoveis={imoveis} corretor={user} isAdmin={isAdmin} setImoveis={setImoveis} setModal={setModal} corretores={corretores}/>}
            {sec==='agenda'&&<Agenda visitas={visitas} corretor={user} isAdmin={isAdmin} corretores={corretores}/>}
            {sec==='tasks'&&<Tarefas tarefas={tarefas} setTarefas={setTarefas} corretor={user} isAdmin={isAdmin} toggleTask={toggleTask} corretores={corretores}/>}
            {sec==='relatorios'&&<Relatorios leads={leads} tarefas={tarefas} visitas={visitas} corretores={corretores} isAdmin={isAdmin} corretor={user}/>}
            {sec==='dispatch'&&<Disparos corretor={user}/>}
          </>}
        </div>
      </div>

      {/* MODALS */}
      {modal==='addLead'&&<Modal title="Novo Lead" onClose={()=>setModal(null)} width={460}><FormLead onSave={addLead} onClose={()=>setModal(null)} corretor={user} imoveis={imoveis} corretores={corretores} isAdmin={isAdmin}/></Modal>}
      {modal==='addImovel'&&<Modal title="Captar Imóvel" onClose={()=>setModal(null)} width={480}><FormImovel onSave={addImovel} onClose={()=>setModal(null)} corretor={user}/></Modal>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<style>
@media(max-width:768px){
  .sidebar-close{display:flex!important}
  .menu-btn{display:flex!important}
  .overlay{display:block!important}
}
</style>
</body>
</html>
