/* ── LOGIN ── */
function Login({onLogin}){
  const [email,setEmail]=useState('');
  const [pass,setPass]=useState('');
  const [showP,setShowP]=useState(false);
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);
  const [hints,setHints]=useState(false);

  const doLogin=async()=>{
    if(!email||!pass){setErr('Preencha e-mail e senha.');return;}
    setLoading(true);setErr('');
    const {data,error}=await db.from('corretores').select('*').eq('email',email.trim().toLowerCase()).eq('senha',pass).single();
    setLoading(false);
    if(error||!data){setErr('E-mail ou senha incorretos.');return;}
    onLogin(data);
  };

  const inp={width:'100%',background:'#1C1C1C',border:'1px solid #2A2A2A',borderRadius:8,padding:'11px 14px',color:'#F0F0F0',fontSize:14,outline:'none'};

  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{width:360,padding:'0 20px'}}>
        <div style={{textAlign:'center',marginBottom:36}}>
          <div style={{fontSize:28,fontWeight:800,color:G,letterSpacing:2,marginBottom:6}}>ALTHOFF</div>
          <div style={{fontSize:10,color:'#444',letterSpacing:3,textTransform:'uppercase'}}>CRM Comercial</div>
        </div>
        <Card style={{padding:28}}>
          <h2 style={{margin:'0 0 22px',fontSize:17,fontWeight:700}}>Entrar na sua conta</h2>
          <div style={{marginBottom:14}}>
            <div style={{fontSize:11,color:'#666',marginBottom:6,textTransform:'uppercase',letterSpacing:1}}>E-mail</div>
            <input style={inp} type="email" value={email} onChange={e=>{setEmail(e.target.value);setErr('');}} placeholder="seu@althoff.com.br" onKeyDown={e=>e.key==='Enter'&&doLogin()}/>
          </div>
          <div style={{marginBottom:20}}>
            <div style={{fontSize:11,color:'#666',marginBottom:6,textTransform:'uppercase',letterSpacing:1}}>Senha</div>
            <div style={{position:'relative'}}>
              <input style={{...inp,paddingRight:42}} type={showP?'text':'password'} value={pass} onChange={e=>{setPass(e.target.value);setErr('');}} placeholder="••••••" onKeyDown={e=>e.key==='Enter'&&doLogin()}/>
              <div onClick={()=>setShowP(!showP)} style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',cursor:'pointer',color:'#555'}}>
                <Ico d={showP?IC.noeye:IC.eye} size={16}/>
              </div>
            </div>
          </div>
          {err&&<div style={{background:'#EF444418',border:'1px solid #EF444430',borderRadius:7,padding:'8px 12px',fontSize:12,color:'#EF4444',marginBottom:14}}>{err}</div>}
          <button onClick={doLogin} disabled={loading} style={{width:'100%',padding:12,borderRadius:8,background:G,border:'none',color:'#000',fontWeight:700,fontSize:15,cursor:'pointer',marginBottom:16,opacity:loading?0.7:1}}>
            {loading?'Entrando...':'Entrar'}
          </button>
          <div onClick={()=>setHints(!hints)} style={{textAlign:'center',fontSize:12,color:'#444',cursor:'pointer'}}>{hints?'▲ Ocultar':'▼ Ver acessos de teste'}</div>
          {hints&&(
            <div style={{marginTop:14,padding:14,background:'#0E0E0E',borderRadius:8,border:'1px solid #1C1C1C'}}>
              <div style={{fontSize:10,color:'#444',marginBottom:8,textTransform:'uppercase',letterSpacing:1}}>Clique para preencher</div>
              {[['ana@althoff.com.br','123456'],['carlos@althoff.com.br','123456'],['admin@althoff.com.br','admin123']].map(([e,p])=>(
                <div key={e} onClick={()=>{setEmail(e);setPass(p);setErr('');}}
                  style={{padding:'6px 8px',borderRadius:6,cursor:'pointer',marginBottom:3,background:email===e?GA:'transparent'}}>
                  <div style={{fontSize:11,color:'#CCC'}}>{e}</div>
                  <div style={{fontSize:10,color:'#444'}}>senha: {p}</div>
                </div>
              ))}
            </div>
          )}
        </Card>
      </div>
    </div>
  );
}

/* ── DASHBOARD ── */
function Dashboard({leads,tarefas,visitas,setSec,corretor,isAdmin,toggleTask}){
  const mine=isAdmin?leads:leads.filter(l=>l.corretor_id===corretor?.id);
  const active=mine.filter(l=>!['Fechado','Perdido'].includes(l.status));
  const closed=mine.filter(l=>l.status==='Fechado');
  const myT=isAdmin?tarefas:tarefas.filter(t=>t.corretor_id===corretor?.id);
  const myV=isAdmin?visitas:visitas.filter(v=>v.corretor_id===corretor?.id);
  const stats=[
    {l:isAdmin?'Total Leads':'Meus Leads',v:mine.length,sub:`${active.length} ativos`,col:'#3B82F6',ic:IC.users},
    {l:'Pipeline',v:fmt(active.reduce((s,l)=>s+(l.valor||0),0)),sub:'em negociação',col:G,ic:IC.trend},
    {l:'Fechamentos',v:closed.length,sub:fmt(closed.reduce((s,l)=>s+(l.valor||0),0)),col:'#22C55E',ic:IC.chk},
    {l:'Tarefas',v:myT.filter(t=>!t.concluida).length,sub:'pendentes',col:'#F97316',ic:IC.clk},
  ];
  return (
    <div>
      {isAdmin&&<div style={{background:'#1A1A0E',border:`1px solid ${G}33`,borderRadius:8,padding:'8px 14px',fontSize:12,color:G,marginBottom:16,display:'flex',alignItems:'center',gap:8}}><Ico d={IC.shld} size={13}/> Modo Administrador</div>}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14,marginBottom:20}}>
        {stats.map(({l,v,sub,col,ic})=>(
          <Card key={l} style={{padding:16}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
              <span style={{fontSize:10,color:'#555',textTransform:'uppercase',letterSpacing:1.2}}>{l}</span>
              <div style={{width:30,height:30,borderRadius:7,background:`${col}18`,display:'flex',alignItems:'center',justifyContent:'center'}}><Ico d={ic} size={14} col={col}/></div>
            </div>
            <div style={{fontSize:20,fontWeight:700,color:col,marginBottom:3}}>{v}</div>
            <div style={{fontSize:11,color:'#444'}}>{sub}</div>
          </Card>
        ))}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
        <Card style={{padding:16}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
            <span style={{fontWeight:600,fontSize:13}}>{isAdmin?'Leads Recentes':'Meus Leads'}</span>
            <span onClick={()=>setSec('pipeline')} style={{fontSize:11,color:G,cursor:'pointer'}}>Ver todos →</span>
          </div>
          {mine.slice(0,6).map(l=>(
            <div key={l.id} style={{display:'flex',alignItems:'center',gap:9,padding:'7px 0',borderBottom:'1px solid #181818'}}>
              <div style={{width:32,height:32,borderRadius:8,background:GA,display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:700,color:G,flexShrink:0}}>{(l.nome||'?')[0]}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{l.nome}</div>
                <div style={{fontSize:11,color:'#555'}}>{l.interesse}</div>
              </div>
              <Badge label={l.status} color={SC[l.status]||'#888'}/>
            </div>
          ))}
          {mine.length===0&&<div style={{fontSize:12,color:'#333',padding:'12px 0'}}>Nenhum lead ainda.</div>}
        </Card>
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          <Card style={{padding:16}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
              <span style={{fontWeight:600,fontSize:13}}>Próximas Visitas</span>
              <span onClick={()=>setSec('agenda')} style={{fontSize:11,color:G,cursor:'pointer'}}>Ver →</span>
            </div>
            {myV.slice(0,3).map(v=>(
              <div key={v.id} style={{display:'flex',alignItems:'center',gap:9,padding:'7px 0',borderBottom:'1px solid #181818'}}>
                <div style={{background:GA,borderRadius:7,padding:'4px 9px',textAlign:'center',flexShrink:0}}>
                  <div style={{fontSize:14,fontWeight:700,color:G}}>{v.hora?.slice(0,5)}</div>
                  <div style={{fontSize:9,color:'#555'}}>{v.data?.slice(8)}/{v.data?.slice(5,7)}</div>
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{v.lead_nome}</div>
                  <div style={{fontSize:11,color:'#555',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{v.imovel_titulo}</div>
                </div>
              </div>
            ))}
            {myV.length===0&&<div style={{fontSize:12,color:'#333',padding:'8px 0'}}>Nenhuma visita agendada.</div>}
          </Card>
          <Card style={{padding:16}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
              <span style={{fontWeight:600,fontSize:13}}>Tarefas Urgentes</span>
              <span onClick={()=>setSec('tasks')} style={{fontSize:11,color:G,cursor:'pointer'}}>Ver →</span>
            </div>
            {myT.filter(t=>!t.concluida&&t.prioridade==='Alta').slice(0,3).map(t=>(
              <div key={t.id} style={{display:'flex',alignItems:'center',gap:9,padding:'7px 0',borderBottom:'1px solid #181818'}}>
                <div onClick={()=>toggleTask(t.id)} style={{cursor:'pointer',flexShrink:0,color:'#333'}}><Ico d={['M12 2a10 10 0 1 0 0 20','M12 6v6l4 2']} size={15}/></div>
                <span style={{fontSize:12,flex:1}}>{t.titulo}</span>
                <span style={{fontSize:10,color:'#EF4444',background:'#EF444418',borderRadius:4,padding:'2px 6px',flexShrink:0}}>{t.prazo?.slice(8)}/{t.prazo?.slice(5,7)}</span>
              </div>
            ))}
            {myT.filter(t=>!t.concluida&&t.prioridade==='Alta').length===0&&<div style={{fontSize:12,color:'#333',padding:'8px 0'}}>Sem urgências! ✓</div>}
          </Card>
        </div>
      </div>
    </div>
  );
}

/* ── PIPELINE ── */
function Pipeline({leads,imoveis,corretor,isAdmin,setLeads,setModal}){
  const [showAll,setShowAll]=useState(isAdmin);
  const [sel,setSel]=useState(null);
  const filtered=showAll?leads:leads.filter(l=>l.corretor_id===corretor?.id);
  const cols=ST.slice(0,-1);

  const moveLead=async(id,status)=>{
    await db.from('leads').update({status}).eq('id',id);
    setLeads(p=>p.map(l=>l.id===id?{...l,status}:l));
    setSel(null);
  };

  return (
    <div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:18}}>
        {isAdmin?(
          <div style={{display:'flex',gap:6}}>
            {[[true,'Todos'],[false,'Meus']].map(([a,l])=>(
              <button key={String(a)} onClick={()=>setShowAll(a)}
                style={{padding:'6px 14px',borderRadius:6,border:`1px solid ${showAll===a?G:'#2A2A2A'}`,background:showAll===a?GA:'transparent',color:showAll===a?G:'#555',fontSize:12,cursor:'pointer'}}>{l}</button>
            ))}
          </div>
        ):<div style={{fontSize:12,color:'#555'}}>Meus leads — {filtered.filter(l=>!['Fechado','Perdido'].includes(l.status)).length} ativos</div>}
        <button onClick={()=>setModal('addLead')} style={{display:'flex',alignItems:'center',gap:6,padding:'8px 16px',borderRadius:8,background:G,border:'none',color:'#000',fontWeight:700,fontSize:13,cursor:'pointer'}}>
          <Ico d={IC.plus} size={14}/> Novo Lead
        </button>
      </div>
      <div style={{display:'flex',gap:11,overflowX:'auto',paddingBottom:12}}>
        {cols.map(status=>{
          const col=SC[status];
          const sLeads=filtered.filter(l=>l.status===status);
          return (
            <div key={status} style={{minWidth:185,flexShrink:0}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:9}}>
                <div style={{display:'flex',alignItems:'center',gap:6}}>
                  <div style={{width:7,height:7,borderRadius:'50%',background:col}}/>
                  <span style={{fontSize:11,fontWeight:600,color:'#AAA'}}>{status}</span>
                </div>
                <span style={{fontSize:10,background:'#1C1C1C',color:'#555',borderRadius:10,padding:'1px 7px'}}>{sLeads.length}</span>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:7}}>
                {sLeads.map(l=>{
                  const open=sel===l.id;
                  return (
                    <div key={l.id} onClick={()=>setSel(open?null:l.id)}
                      style={{background:'#141414',border:`1px solid ${open?col:'#212121'}`,borderRadius:10,padding:11,cursor:'pointer'}}>
                      <div style={{fontSize:12,fontWeight:600,marginBottom:3}}>{l.nome}</div>
                      <div style={{fontSize:11,color:'#555',marginBottom:8}}>{l.interesse}</div>
                      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                        <span style={{fontSize:12,color:G,fontWeight:600}}>{fmt(l.valor)}</span>
                      </div>
                      {open&&(
                        <div style={{marginTop:9,paddingTop:9,borderTop:'1px solid #1E1E1E'}}>
                          <div style={{fontSize:10,color:'#555',marginBottom:5}}>Mover para:</div>
                          <div style={{display:'flex',flexWrap:'wrap',gap:3}}>
                            {ST.filter(s=>s!==status).map(s=>(
                              <span key={s} onClick={e=>{e.stopPropagation();moveLead(l.id,s);}}
                                style={{fontSize:10,background:`${SC[s]}15`,color:SC[s],border:`1px solid ${SC[s]}30`,borderRadius:4,padding:'2px 5px',cursor:'pointer'}}>{s}</span>
                            ))}
                          </div>
                          {l.telefone&&<a href={`tel:${l.telefone}`} style={{display:'flex',alignItems:'center',gap:3,fontSize:11,color:'#22C55E',textDecoration:'none',marginTop:8}}><Ico d={IC.ph} size={10}/>{l.telefone}</a>}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ── IMÓVEIS ── */
function Imoveis({imoveis,corretor,isAdmin,setImoveis,setModal}){
  const [tab,setTab]=useState('all');
  const stC={Disponível:'#22C55E',Negociando:G,Reservado:'#8B5CF6'};
  const shown=tab==='mine'?imoveis.filter(p=>p.captador_id===corretor?.id):imoveis;
  return (
    <div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:18}}>
        <div style={{display:'flex',gap:6}}>
          {[['all','Todos'],['mine','Meus Imóveis']].map(([t,l])=>(
            <button key={t} onClick={()=>setTab(t)}

/* ── AGENDA ── */
function Agenda({visitas,corretor,isAdmin}){
  const mine=isAdmin?visitas:visitas.filter(v=>v.corretor_id===corretor?.id);
  const grouped=mine.reduce((a,v)=>{(a[v.data]=a[v.data]||[]).push(v);return a;},{});
  const DAYS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const MONTHS=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return (
    <div>
      <div style={{display:'flex',justifyContent:'flex-end',marginBottom:18}}>
        <button style={{display:'flex',alignItems:'center',gap:6,padding:'8px 16px',borderRadius:8,background:G,border:'none',color:'#000',fontWeight:700,fontSize:13,cursor:'pointer'}}><Ico d={IC.plus} size={14}/> Agendar Visita</button>
      </div>
      {Object.keys(grouped).length===0&&<div style={{textAlign:'center',padding:'60px 20px',color:'#333'}}>Nenhuma visita agendada.</div>}
      {Object.keys(grouped).sort().map(date=>{
        const d=new Date(date+'T12:00:00');
        return (
          <div key={date} style={{marginBottom:22}}>
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:10}}>
              <div style={{background:GA,border:`1px solid ${G}33`,borderRadius:9,padding:'5px 13px',textAlign:'center',flexShrink:0}}>
                <div style={{fontSize:10,color:G,fontWeight:600}}>{DAYS[d.getDay()]}</div>
                <div style={{fontSize:20,fontWeight:800,color:G,lineHeight:1}}>{d.getDate()}</div>
                <div style={{fontSize:9,color:'#555'}}>{MONTHS[d.getMonth()]}</div>
              </div>
              <div style={{flex:1,height:1,background:'#1A1A1A'}}/>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:8,marginLeft:72}}>
              {grouped[date].map(v=>(
                <Card key={v.id} style={{padding:'13px 15px'}}>
                  <div style={{display:'flex',alignItems:'center',gap:11}}>
                    <div style={{background:'#1C1C1C',borderRadius:7,padding:'5px 11px',flexShrink:0,textAlign:'center'}}>
                      <div style={{fontSize:17,fontWeight:700,color:G}}>{v.hora?.slice(0,5)}</div>
                    </div>
                    <div style={{flex:1}}>
                      <div style={{fontSize:13,fontWeight:700}}>{v.lead_nome}</div>
                      <div style={{fontSize:11,color:'#555'}}>{v.imovel_titulo}</div>
                    </div>
                    <Badge label={v.status} color={v.status==='Confirmada'?'#22C55E':G}/>
                  </div>
                </Card>
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ── TAREFAS ── */
function Tarefas({tarefas,corretor,isAdmin,toggleTask}){
  const mine=isAdmin?tarefas:tarefas.filter(t=>t.corretor_id===corretor?.id);
  const pending=mine.filter(t=>!t.concluida);
  const done=mine.filter(t=>t.concluida);
  return (
    <div>
      <div style={{display:'flex',justifyContent:'flex-end',marginBottom:18}}>
        <button style={{display:'flex',alignItems:'center',gap:6,padding:'8px 16px',borderRadius:8,background:G,border:'none',color:'#000',fontWeight:700,fontSize:13,cursor:'pointer'}}><Ico d={IC.plus} size={14}/> Nova Tarefa</button>
      </div>
      <div style={{marginBottom:22}}>
        <div style={{fontSize:11,color:'#555',fontWeight:600,textTransform:'uppercase',letterSpacing:1.2,marginBottom:10}}>Pendentes ({pending.length})</div>
        {pending.map(t=>(
          <Card key={t.id} style={{padding:'11px 15px',marginBottom:7}}>
            <div style={{display:'flex',alignItems:'center',gap:11}}>
              <div onClick={()=>toggleTask(t.id)} style={{width:19,height:19,borderRadius:'50%',border:'2px solid #2E2E2E',cursor:'pointer',flexShrink:0}}/>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:600}}>{t.titulo}</div>
                <div style={{fontSize:11,color:'#555',marginTop:2}}>{t.tipo} · {t.prazo?.slice(8)}/{t.prazo?.slice(5,7)}</div>
              </div>
              <Badge label={t.prioridade} color={PRI_C[t.prioridade]||'#888'}/>
            </div>
          </Card>
        ))}
        {pending.length===0&&<div style={{fontSize:13,color:'#333',padding:'20px 0',textAlign:'center'}}>Todas as tarefas concluídas! 🎉</div>}
      </div>
      {done.length>0&&(
        <div>
          <div style={{fontSize:11,color:'#333',fontWeight:600,textTransform:'uppercase',letterSpacing:1.2,marginBottom:10}}>Concluídas ({done.length})</div>
          {done.map(t=>(
            <div key={t.id} style={{display:'flex',alignItems:'center',gap:11,padding:'9px 15px',background:'#0E0E0E',borderRadius:8,border:'1px solid #181818',opacity:0.55,marginBottom:5}}>
              <div onClick={()=>toggleTask(t.id)} style={{width:19,height:19,borderRadius:'50%',background:'#22C55E18',border:'2px solid #22C55E',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Ico d={IC.chk} size={10} col="#22C55E"/></div>
              <span style={{fontSize:12,textDecoration:'line-through',color:'#444'}}>{t.titulo}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ── DISPAROS ── */
function Disparos({corretor}){
  const [tab,setTab]=useState('whatsapp');
  const [tIdx,setTIdx]=useState(0);
  const [lead,setLead]=useState('');
  const [copied,setCopied]=useState(false);
  const tpls=tab==='whatsapp'?WA_TPL:EM_TPL;
  const tpl=tpls[Math.min(tIdx,tpls.length-1)];
  const ln=lead||'Cliente';
  const bn=corretor?.nome||'Corretor';
  const preview=tab==='whatsapp'?tpl.fn(ln,bn):`Assunto: ${tpl.sf(ln)}\n\n${tpl.bf(ln,bn)}`;
  const copy=()=>{navigator.clipboard.writeText(preview);setCopied(true);setTimeout(()=>setCopied(false),2000);};
  return (
    <div style={{display:'grid',gridTemplateColumns:'265px 1fr',gap:18}}>
      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        <Card style={{padding:5,display:'flex',gap:4}}>
          {[['whatsapp','WhatsApp'],['email','E-mail']].map(([t,l])=>(
            <button key={t} onClick={()=>{setTab(t);setTIdx(0);}}
              style={{flex:1,padding:8,borderRadius:7,border:'none',background:tab===t?GA:'transparent',color:tab===t?G:'#555',fontWeight:tab===t?700:400,fontSize:12,cursor:'pointer'}}>{l}</button>
          ))}
        </Card>
        <Card style={{padding:13}}>
          <div style={{fontSize:10,color:'#555',marginBottom:6,textTransform:'uppercase',letterSpacing:1.2}}>Nome do Lead</div>
          <input value={lead} onChange={e=>setLead(e.target.value)} placeholder="Ex: João Silva"
            style={{width:'100%',background:'#1C1C1C',border:'1px solid #272727',borderRadius:6,padding:'8px 10px',color:'#F0F0F0',fontSize:13,outline:'none'}}/>
        </Card>
        <Card style={{padding:13}}>
          <div style={{fontSize:10,color:'#555',marginBottom:9,textTransform:'uppercase',letterSpacing:1.2}}>Modelo</div>
          {tpls.map((t,i)=>(
            <div key={i} onClick={()=>setTIdx(i)}
              style={{padding:'8px 11px',borderRadius:7,cursor:'pointer',marginBottom:3,background:tIdx===i?GA:'transparent',border:`1px solid ${tIdx===i?G+'44':'transparent'}`,fontSize:12,color:tIdx===i?G:'#777'}}>{t.name}</div>
          ))}
        </Card>
      </div>
      <Card style={{padding:18,display:'flex',flexDirection:'column'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:15}}>
          <div><div style={{fontWeight:700,fontSize:14}}>Prévia</div><div style={{fontSize:11,color:'#444',marginTop:1}}>Enviando como: {bn}</div></div>
          <button onClick={copy} style={{display:'flex',alignItems:'center',gap:6,padding:'7px 14px',borderRadius:7,background:copied?'#22C55E18':GA,border:`1px solid ${copied?'#22C55E44':G+'44'}`,color:copied?'#22C55E':G,fontSize:12,fontWeight:600,cursor:'pointer'}}>
            {copied?<><Ico d={IC.chk} size={13}/> Copiado!</>:'Copiar'}
          </button>
        </div>
        <div style={{flex:1,background:'#0C0C0C',borderRadius:10,padding:18,border:'1px solid #181818',minHeight:180}}>
          {tab==='whatsapp'?(
            <div style={{background:'#1B3A24',borderRadius:'12px 12px 2px 12px',padding:'11px 14px',display:'inline-block',maxWidth:'85%',float:'right'}}>
              <pre style={{margin:0,fontFamily:'system-ui',fontSize:13,color:'#F0F0F0',whiteSpace:'pre-wrap',lineHeight:1.65}}>{preview.replace(/\*(.*?)\*/g,'$1')}</pre>
            </div>
          ):(
            <div>
              <div style={{borderBottom:'1px solid #1C1C1C',paddingBottom:9,marginBottom:10}}><span style={{fontSize:11,color:'#555'}}>Assunto: </span><span style={{fontSize:13,fontWeight:600}}>{tpl.sf(ln)}</span></div>
              <pre style={{margin:0,fontFamily:'system-ui',fontSize:13,color:'#CCC',whiteSpace:'pre-wrap',lineHeight:1.75}}>{tpl.bf(ln,bn)}</pre>
            </div>
          )}
          <div style={{clear:'both'}}/>
        </div>
      </Card>
    </div>
  );
}

/* ── MAIN APP ── */
function App(){
  const [user,setUser]=useState(null);
  const [sec,setSec]=useState('dashboard');
  const [leads,setLeads]=useState([]);
  const [imoveis,setImoveis]=useState([]);
  const [tarefas,setTarefas]=useState([]);
  const [visitas,setVisitas]=useState([]);
  const [loading,setLoading]=useState(false);
  const [modal,setModal]=useState(null);

  const isAdmin=user?.is_admin||false;

  useEffect(()=>{if(user)loadAll();},[user]);

  const loadAll=async()=>{
    setLoading(true);
    const [l,im,t,v]=await Promise.all([
      db.from('leads').select('*').order('criado_em',{ascending:false}),
      db.from('imoveis').select('*').order('criado_em',{ascending:false}),
      db.from('tarefas').select('*').order('prazo',{ascending:true}),
      db.from('visitas').select('*').order('data',{ascending:true}),
    ]);
    setLeads(l.data||[]);
    setImoveis(im.data||[]);
    setTarefas(t.data||[]);
    setVisitas(v.data||[]);
    setLoading(false);
  };

  const addLead=async(f)=>{
    const bId=f.imovel_id?(imoveis.find(p=>p.id===f.imovel_id)?.captador_id||user?.id):user?.id;
    const {data}=await db.from('leads').insert({...f,corretor_id:bId}).select().single();
    if(data)setLeads(p=>[data,...p]);
    setModal(null);
  };

  const addImovel=async(f)=>{
    const {data}=await db.from('imoveis').insert({...f,captador_id:user?.id}).select().single();
    if(data)setImoveis(p=>[data,...p]);
    setModal(null);
  };

  const toggleTask=async(id)=>{
    const t=tarefas.find(x=>x.id===id);
    if(!t)return;
    await db.from('tarefas').update({concluida:!t.concluida}).eq('id',id);
    setTarefas(p=>p.map(x=>x.id===id?{...x,concluida:!x.concluida}:x));
  };

  if(!user)return <Login onLogin={setUser}/>;

  const NAV=[
    {id:'dashboard',ic:IC.dash,l:'Dashboard'},
    {id:'pipeline',ic:IC.users,l:'Pipeline'},
    {id:'imoveis',ic:IC.bld,l:'Imóveis'},
    {id:'agenda',ic:IC.cal,l:'Agenda'},
    {id:'tasks',ic:IC.task,l:'Tarefas'},
    {id:'dispatch',ic:IC.send,l:'Disparos'},
  ];
  const TITLES={dashboard:'Dashboard',pipeline:'Pipeline de Leads',imoveis:'Imóveis',agenda:'Agenda de Visitas',tasks:'Tarefas',dispatch:'Disparos'};

  return (
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      <div style={{width:215,background:'#0D0D0D',borderRight:'1px solid #1C1C1C',display:'flex',flexDirection:'column',flexShrink:0}}>
        <div style={{padding:'18px 18px 14px',borderBottom:'1px solid #181818'}}>
          <div style={{fontSize:16,fontWeight:800,color:G,letterSpacing:1}}>ALTHOFF</div>
          <div style={{fontSize:10,color:'#444',letterSpacing:2.5,textTransform:'uppercase',marginTop:2}}>CRM Comercial</div>
        </div>
        <nav style={{flex:1,padding:'10px 8px'}}>
          {NAV.map(({id,ic,l})=>(
            <div key={id} onClick={()=>setSec(id)}
              style={{display:'flex',alignItems:'center',gap:9,padding:'9px 11px',borderRadius:8,cursor:'pointer',marginBottom:2,background:sec===id?GA:'transparent',color:sec===id?G:'#555'}}>
              <Ico d={ic} size={15} col={sec===id?G:'#555'}/>
              <span style={{fontSize:13,fontWeight:sec===id?600:400}}>{l}</span>
            </div>
          ))}
        </nav>
        <div style={{padding:'12px 10px',borderTop:'1px solid #181818'}}>
          <div style={{display:'flex',alignItems:'center',gap:9,padding:'8px 10px',background:'#161616',borderRadius:8,border:'1px solid #222',marginBottom:8}}>
            {isAdmin
              ?<div style={{width:26,height:26,borderRadius:'50%',background:'#222',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Ico d={IC.shld} size={13} col={G}/></div>
              :<Avatar b={user} size={26}/>}
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:12,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{isAdmin?'Administrador':user?.nome}</div>
              <div style={{fontSize:10,color:'#444'}}>{isAdmin?'Acesso total':'Corretor(a)'}</div>
            </div>
          </div>
          <button onClick={()=>setUser(null)}
            style={{width:'100%',display:'flex',alignItems:'center',justifyContent:'center',gap:7,padding:7,borderRadius:7,background:'transparent',border:'1px solid #1E1E1E',color:'#555',fontSize:12,cursor:'pointer'}}>
            <Ico d={IC.out} size={13}/> Sair
          </button>
        </div>
      </div>

      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div style={{padding:'14px 22px',borderBottom:'1px solid #181818',display:'flex',alignItems:'center',justifyContent:'space-between',background:'#0A0A0A',flexShrink:0}}>
          <div>
            <h1 style={{margin:0,fontSize:17,fontWeight:700}}>{TITLES[sec]}</h1>
            <div style={{fontSize:11,color:'#444',marginTop:1}}>Althoff Grupo — CRM Comercial</div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:32,height:32,borderRadius:8,background:'#161616',border:'1px solid #222',display:'flex',alignItems:'center',justifyContent:'center',position:'relative'}}>
              <Ico d={IC.bell} size={15} col="#666"/>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:8,background:'#161616',border:`1px solid ${G}33`,borderRadius:8,padding:'5px 11px'}}>
              {isAdmin?<Ico d={IC.shld} size={14} col={G}/>:<Avatar b={user} size={22}/>}
              <span style={{fontSize:12,fontWeight:600}}>{isAdmin?'Admin':user?.nome?.split(' ')[0]}</span>
            </div>
          </div>
        </div>

        <div style={{flex:1,overflow:'auto',padding:22}}>
          {loading?<Spin/>:(<>
            {sec==='dashboard'&&<Dashboard leads={leads} tarefas={tarefas} visitas={visitas} setSec={setSec} corretor={user} isAdmin={isAdmin} toggleTask={toggleTask}/>}
            {sec==='pipeline'&&<Pipeline leads={leads} imoveis={imoveis} corretor={user} isAdmin={isAdmin} setLeads={setLeads} setModal={setModal}/>}
            {sec==='imoveis'&&<Imoveis imoveis={imoveis} corretor={user} isAdmin={isAdmin} setImoveis={setImoveis} setModal={setModal}/>}
            {sec==='agenda'&&<Agenda visitas={visitas} corretor={user} isAdmin={isAdmin}/>}
            {sec==='tasks'&&<Tarefas tarefas={tarefas} corretor={user} isAdmin={isAdmin} toggleTask={toggleTask}/>}
            {sec==='dispatch'&&<Disparos corretor={user}/>}
          </>)}
        </div>
      </div>

      {modal&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.78)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000}} onClick={()=>setModal(null)}>
          <div style={{background:'#141414',border:'1px solid #272727',borderRadius:16,padding:24,width:modal==='addImovel'?480:420,maxWidth:'92vw',maxHeight:'90vh',overflowY:'auto'}} onClick={e=>e.stopPropagation()}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
              <h2 style={{margin:0,fontSize:16,fontWeight:700}}>{modal==='addLead'?'Novo Lead':'Captar Imóvel'}</h2>
              <div onClick={()=>setModal(null)} style={{cursor:'pointer',color:'#666'}}><Ico d={IC.x} size={17}/></div>
            </div>
            {modal==='addLead'&&<ModalLead onSave={addLead} onClose={()=>setModal(null)} corretor={user} imoveis={imoveis} isAdmin={isAdmin}/>}
            {modal==='addImovel'&&<ModalImovel onSave={addImovel} onClose={()=>setModal(null)} corretor={user}/>}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
